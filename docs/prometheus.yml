
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: mon-01

scrape_configs:
  - job_name: office-controller
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - 192.168.20.10:8080
        labels:
          instance: ctrl-01
          service: office-receiver
